name: orbit_app
description: "Orbit — A private, self-hosted operating system for developers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  supabase_flutter: ^2.12.4
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  fpdart: ^1.2.0
  flutter_dotenv: ^6.0.1
  equatable: ^2.0.8
  google_sign_in: ^7.2.0
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  firebase_remote_config: ^6.5.3
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  file_picker: ^11.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
